<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComuEnglish</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand" data-route="home" style="cursor:pointer;" title="Go to Home">
      <span class="topbar__logo">CE</span>
      <div style="display:flex; flex-direction:column;">
        <h1 class="topbar__title" style="margin:0; line-height:1.1;">ComuEnglish</h1>
        <span style="font-size:.7rem; color:#94a3b8; font-weight:normal;">by ComuTech</span>
      </div>
    </div>

    <nav class="topbar__nav" id="main-nav">
      <button class="nav-btn" data-route="home">Home</button>
      <button class="nav-btn is-active" data-route="today">📅 Today</button>
      <button class="nav-btn" data-route="progress">📊 Progress</button>
      <button class="nav-btn" data-route="fundamentals">Fundamentals</button>
      <button class="nav-btn" data-route="comprehension">Comprehension</button>
      <button class="nav-btn" data-route="production">Production</button>
      <button class="nav-btn" data-route="mock">Mock Exam</button>
      <button class="nav-btn" id="open-settings" title="Settings">⚙</button>
    </nav>

    <div class="topbar__level">
      <label for="level-select">Level</label>
      <select id="level-select">
        <option value="a2">A2 Elementary</option>
        <option value="b1">B1 Intermediate</option>
        <option value="b2">B2 Upper Intermediate</option>
      </select>
    </div>
  </header>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <p class="sidebar__placeholder">Select a module to view its units.</p>
    </aside>

    <main class="content" id="view">
      <p class="content__placeholder">Loading...</p>
    </main>

  </div>

  <dialog id="settings-modal" class="modal">
    <h2 class="modal__title">DeepSeek Settings</h2>
    <label class="modal__label" for="deepseek-key">API Key</label>
    <input class="modal__input" type="password" id="deepseek-key" placeholder="sk-...">
    <p class="modal__hint">The key is stored only in this browser.</p>
    <div class="modal__actions">
      <button class="btn btn--primary" id="save-key">Save</button>
      <button class="btn btn--ghost" id="close-settings">Close</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>

</body>
</html>
