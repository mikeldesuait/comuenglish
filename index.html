<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComuEnglish</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand" data-route="home" style="cursor:pointer;" title="Go to Home">
      <span class="topbar__logo">CE</span>
      <div style="display:flex; flex-direction:column;">
        <h1 class="topbar__title" style="margin:0; line-height:1.1;">ComuEnglish</h1>
        <span style="font-size:.7rem; color:#94a3b8; font-weight:normal;">by ComuTech</span>
      </div>
    </div>

    <nav class="topbar__nav" id="main-nav">
      <div class="nav-group nav-group--center">
        <button class="nav-btn" data-route="home">Home</button>
        <button class="nav-btn" data-route="how">How it works</button>
      </div>
      <div class="nav-group nav-group--right">
        <span class="nav-divider"></span>
        <button class="nav-btn" data-route="today">My Plan</button>
        <button class="nav-btn" id="open-settings" title="Settings">⚙</button>
      </div>
    </nav>


  </header>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <p class="sidebar__title">STUDY</p>
      <button class="sidebar__link" data-route="fundamentals">
        <span class="sidebar__icon">📖</span>
        <span>Fundamentals</span>
      </button>
      <button class="sidebar__link" data-route="comprehension">
        <span class="sidebar__icon">📚</span>
        <span>Comprehension</span>
      </button>
      <button class="sidebar__link" data-route="production">
        <span class="sidebar__icon">✍️</span>
        <span>Production</span>
      </button>
      <button class="sidebar__link" data-route="mock">
        <span class="sidebar__icon">🎓</span>
        <span>Mock Exam</span>
      </button>

      <div class="sidebar__divider"></div>

      <p class="sidebar__title">TRACK</p>
      <button class="sidebar__link" data-route="progress">
        <span class="sidebar__icon">📊</span>
        <span>Progress</span>
      </button>
    </aside>

    <main class="content" id="view">
      <p class="content__placeholder">Loading...</p>
    </main>

  </div>

  <dialog id="settings-modal" class="modal" style="max-width: 560px;">
    <h2 class="modal__title">Settings</h2>

      <p style="font-size: .82rem; color: #64748b; margin-bottom: 12px;">Download a backup file with all your progress.</p>
      <button class="btn btn--primary" id="export-progress">Export progress</button>
    </div>

    <div style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-bottom: 20px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">Import progress</h3>
      <p style="font-size: .82rem; color: #64748b; margin-bottom: 12px;">Load a backup file. This will replace your current progress.</p>
      <input type="file" id="import-progress-file" accept=".json" style="display: none;">
      <button class="btn btn--ghost" id="import-progress">Import progress</button>
    </div>

    <div style="border-top: 1px solid #e2e8f0; padding-top: 20px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">Auto-backups</h3>
      <p style="font-size: .82rem; color: #64748b; margin-bottom: 12px;">Automatic backups saved every 6 hours.</p>
      <button class="btn btn--ghost" id="view-backups">View backups</button>
    </div>

    <div id="logout-section" style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-bottom: 20px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">Account</h3>
      <p style="font-size: .82rem; color: #64748b; margin-bottom: 12px;" id="account-info">Not signed in.</p>
      <button class="btn btn--ghost" id="logout-btn" style="display: none;">Sign out</button>
    </div>

    <div class="modal__actions" style="margin-top: 24px;">
      <button class="btn btn--ghost" id="close-settings">Close</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>

</body>
</html>
