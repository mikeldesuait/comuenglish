<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComuEnglish</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand" data-route="home" style="cursor:pointer;" title="Go to Home">
      <span class="topbar__logo">CE</span>
      <div style="display:flex; flex-direction:column;">
        <h1 class="topbar__title" style="margin:0; line-height:1.1;">ComuEnglish</h1>
        <span style="font-size:.7rem; color:#94a3b8; font-weight:normal;">by ComuTech</span>
      </div>
    </div>

    <nav class="topbar__nav" id="main-nav">
      <div class="nav-group nav-group--center">
        <button class="nav-btn" data-route="home">Home</button>
        <button class="nav-btn" data-route="how">How it works</button>
      </div>
      <div class="nav-group nav-group--right">
        <span class="nav-divider"></span>
        <button class="nav-btn" data-route="today">My Plan</button>
        <button class="nav-btn" id="open-settings" title="Settings">⚙</button>
      </div>
    </nav>


  </header>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <p class="sidebar__title">STUDY</p>
      <button class="sidebar__link" data-route="fundamentals">
        <span class="sidebar__icon">📖</span>
        <span>Fundamentals</span>
      </button>
      <button class="sidebar__link" data-route="comprehension">
        <span class="sidebar__icon">📚</span>
        <span>Comprehension</span>
      </button>
      <button class="sidebar__link" data-route="production">
        <span class="sidebar__icon">✍️</span>
        <span>Production</span>
      </button>
      <button class="sidebar__link" data-route="mock">
        <span class="sidebar__icon">🎓</span>
        <span>Mock Exam</span>
      </button>

      <div class="sidebar__divider"></div>

      <p class="sidebar__title">TRACK</p>
      <button class="sidebar__link" data-route="progress">
        <span class="sidebar__icon">📊</span>
        <span>Progress</span>
      </button>
    </aside>

    <main class="content" id="view">
      <p class="content__placeholder">Loading...</p>
    </main>

  </div>

  <dialog id="settings-modal" class="modal">
    <h2 class="modal__title">DeepSeek Settings</h2>
    <label class="modal__label" for="deepseek-key">API Key</label>
    <input class="modal__input" type="password" id="deepseek-key" placeholder="sk-...">
    <p class="modal__hint">The key is stored only in this browser.</p>
    <div class="modal__actions">
      <button class="btn btn--primary" id="save-key">Save</button>
      <button class="btn btn--ghost" id="close-settings">Close</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>

</body>
</html>
