<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComuEnglish</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand" data-route="home" style="cursor:pointer;" title="Go to Home">
      <span class="topbar__logo">CE</span>
      <div style="display:flex; flex-direction:column;">
        <h1 class="topbar__title" style="margin:0; line-height:1.1;">ComuEnglish</h1>
        <span style="font-size:.7rem; color:#94a3b8; font-weight:normal;">by ComuTech</span>
      </div>
    </div>

    <nav class="topbar__nav" id="main-nav">
      <div class="nav-group nav-group--center">
        <button class="nav-btn" data-route="home">Home</button>
        <button class="nav-btn" data-route="how">How it works</button>
      </div>
      <div class="nav-group nav-group--right">
        <span class="nav-divider"></span>
        <button class="nav-btn" data-route="today">My Plan</button>
        <button class="nav-btn" id="open-settings" title="Settings">⚙</button>
      </div>
    </nav>


  </header>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <p class="sidebar__title">STUDY</p>
      <button class="sidebar__link" data-route="fundamentals">
        <span class="sidebar__icon">📖</span>
        <span>Fundamentals</span>
      </button>
      <button class="sidebar__link" data-route="comprehension">
        <span class="sidebar__icon">📚</span>
        <span>Comprehension</span>
      </button>
      <button class="sidebar__link" data-route="production">
        <span class="sidebar__icon">✍️</span>
        <span>Production</span>
      </button>
      <button class="sidebar__link" data-route="mock">
        <span class="sidebar__icon">🎓</span>
        <span>Mock Exam</span>
      </button>

      <div class="sidebar__divider"></div>

      <p class="sidebar__title">TRACK</p>
      <button class="sidebar__link" data-route="progress">
        <span class="sidebar__icon">📊</span>
        <span>Progress</span>
      </button>
    </aside>

    <main class="content" id="view">
      <p class="content__placeholder">Loading...</p>
    </main>

  </div>

  <dialog id="settings-modal" class="modal" style="max-width: 520px;">
    <h2 class="modal__title">Settings</h2>

    <!-- CUENTA -->
    <div style="margin-bottom: 24px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">👤 Cuenta</h3>
      <p style="font-size: .85rem; color: #64748b; margin: 0 0 12px;" id="account-info">Cargando…</p>
      <button class="btn btn--ghost" id="logout-btn" style="display: none; font-size: .85rem; padding: 8px 16px;">Cerrar sesión</button>
    </div>

    <!-- SEGURIDAD -->
    <div style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-bottom: 24px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">🔒 Seguridad</h3>
      <p style="font-size: .85rem; color: #64748b; margin: 0 0 12px;">Actualiza tu contraseña de acceso.</p>

      <button class="btn btn--ghost" id="toggle-change-password" style="font-size: .85rem; padding: 8px 16px;">Cambiar contraseña</button>

      <div id="change-password-block" style="display: none; margin-top: 16px; padding: 16px; background: #f8fafc; border-radius: 10px;">
        <label style="display:block;margin-bottom:.75rem;">
          <span style="font-size:.82rem;color:#334155;font-weight:600;">Contraseña actual (opcional)</span>
          <input type="password" id="current-password" placeholder="••••••••" style="width:100%;padding:.6rem .75rem;border:1.5px solid #d1d5db;border-radius:8px;font-size:.95rem;box-sizing:border-box;margin-top:.35rem;font-family:inherit;">
        </label>

        <label style="display:block;margin-bottom:.75rem;">
          <span style="font-size:.82rem;color:#334155;font-weight:600;">Nueva contraseña</span>
          <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" style="width:100%;padding:.6rem .75rem;border:1.5px solid #d1d5db;border-radius:8px;font-size:.95rem;box-sizing:border-box;margin-top:.35rem;font-family:inherit;">
        </label>

        <label style="display:block;margin-bottom:.75rem;">
          <span style="font-size:.82rem;color:#334155;font-weight:600;">Confirmar nueva contraseña</span>
          <input type="password" id="new-password2" placeholder="Repite la contraseña" style="width:100%;padding:.6rem .75rem;border:1.5px solid #d1d5db;border-radius:8px;font-size:.95rem;box-sizing:border-box;margin-top:.35rem;font-family:inherit;">
        </label>

        <button class="btn btn--primary" id="change-password-btn" style="margin-top:.25rem;">Guardar contraseña</button>
        <p id="change-password-msg" style="margin:.75rem 0 0;font-size:.85rem;min-height:1.2em;"></p>
      </div>
    </div>

    <!-- DATOS -->
    <div style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-bottom: 24px;">
      <h3 style="font-size: .95rem; font-weight: 700; margin-bottom: 4px; color: #0f172a;">💾 Datos y backups</h3>
      <p style="font-size: .85rem; color: #64748b; margin: 0 0 12px;">Descarga o carga una copia de tu progreso.</p>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn btn--primary" id="export-progress" style="font-size: .85rem; padding: 8px 16px;">Exportar progreso</button>
        <input type="file" id="import-progress-file" accept=".json" style="display: none;">
        <button class="btn btn--ghost" id="import-progress" style="font-size: .85rem; padding: 8px 16px;">Importar progreso</button>
      </div>

      <p style="font-size: .78rem; color: #94a3b8; margin: 12px 0 8px;">Backups automáticos guardados cada 6 horas.</p>
      <button class="btn btn--ghost" id="view-backups" style="font-size: .85rem; padding: 8px 16px;">Ver backups automáticos</button>
    </div>

    <div class="modal__actions" style="margin-top: 24px;">
      <button class="btn btn--ghost" id="close-settings">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>

</body>
</html>
